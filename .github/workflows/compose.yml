name: compose

on:
  push:
    paths: ["compose.yaml", "**/Dockerfile", ".github/workflows/compose.yml"]
  pull_request:
    paths: ["compose.yaml", "**/Dockerfile", ".github/workflows/compose.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder env files
        run: |
          echo "CLOUDFLARE_TUNNEL_TOKEN=ci" > .env
          for dir in backend discord-bot stt-worker comic; do touch "$dir/.env"; done
      - name: Validate every profile combination
        run: |
          for profiles in "" transcription comic transcription,comic; do
            echo "::group::COMPOSE_PROFILES='$profiles'"
            COMPOSE_PROFILES="$profiles" docker compose config --quiet
            COMPOSE_PROFILES="$profiles" docker compose config --services
            echo "::endgroup::"
          done
      - name: GPU handover names match
        # The comic worker stops STT and starts/stops ComfyUI by name through docker-proxy;
        # compose, the proxy allow-list and the worker's settings must agree.
        run: |
          COMPOSE_PROFILES=transcription,comic docker compose config > resolved.yaml
          grep -q "container_name: vtt-stt-worker" resolved.yaml
          grep -q "container_name: vtt-comfyui" resolved.yaml
          grep -qF "(vtt-stt-worker|vtt-comfyui)/(start|stop)" resolved.yaml
          grep -q 'stt_container_name: str = "vtt-stt-worker"' comic/app/config.py
          grep -q 'comfyui_container_name: str = "vtt-comfyui"' comic/app/config.py
          # The dashboard lists containers of this compose project only.
          grep -q "^name: vtt-automaton$" resolved.yaml
          grep -q 'compose_project: str = "vtt-automaton"' comic/app/config.py
          # The worker sends IP-Adapter references as characters/<id>/<file> in ComfyUI's input.
          grep -q "target: /app/input/characters" resolved.yaml
          grep -q 'reference = f"characters/' comic/app/pipeline.py
