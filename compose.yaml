# Home-server deployment. Later phases add: discord-bot (Node), stt-worker (GPU), redis.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      VTT_RULES_DB_PATH: /data/pf2e_remaster.db
    volumes:
      # Read-write: the backend refreshes the rules DB from Archives of Nethys in place.
      - ./data:/data
    # Localhost only, for curl testing on the server. Public access goes through cloudflared.
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # Tunnel token from Cloudflare Zero Trust -> Networks -> Tunnels. In the tunnel's
      # Public Hostname settings, point arbiter.ttrpg-arbiter.org at http://backend:8765
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - backend
    restart: unless-stopped
