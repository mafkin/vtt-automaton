# Home-server deployment.
# Profiles (COMPOSE_PROFILES in .env; scripts/setup-server.sh keeps it up to date):
#   transcription: the Discord bot and the GPU speech-to-text worker
#   comic:         comics from session transcripts, drawn by Gemini (dashboard on :8771)

# Fixed project name, whatever the checkout folder is called: container names and the
# dashboard's container list (comic/app/config.py: compose_project) depend on it.
name: vtt-automaton

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      VTT_RULES_DB_PATH: /data/pf2e_remaster.db
      VTT_SESSIONS_DB_PATH: /data/sessions.db
    volumes:
      # Read-write: the backend refreshes the rules DB and stores session transcripts here.
      - ./data:/data
    # Localhost only, for curl testing on the server. Public access goes through cloudflared.
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # Tunnel token from Cloudflare Zero Trust -> Networks -> Tunnels. In the tunnel's
      # Public Hostname settings, point arbiter.ttrpg-arbiter.org at http://backend:8765
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - backend
    restart: unless-stopped

  # --- transcription ---------------------------------------------------------------------

  stt-worker:
    profiles: [transcription]
    build: ./stt-worker
    # Fixed name, so it's easy to find in logs and docker commands.
    container_name: vtt-stt-worker
    env_file: ./stt-worker/.env
    environment:
      STT_BACKEND_URL: http://backend:8765
    volumes:
      - whisper-models:/models # model download (~3 GB for large-v3) survives rebuilds
    # Needs the NVIDIA driver and NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - backend
    restart: unless-stopped

  discord-bot:
    profiles: [transcription]
    build: ./discord-bot
    env_file: ./discord-bot/.env
    environment:
      BACKEND_URL: http://backend:8765
      STT_URL: http://stt-worker:8770
      DATA_DIR: /data
      RECORDINGS_DIR: /recordings
    volumes:
      - ./data/discord-bot:/data
      # Podcast tracks (sessions started with podcast:true): <session>/tracks/<user>.ogg
      - ./data/recordings:/recordings
    depends_on:
      - backend
      - stt-worker
    restart: unless-stopped

  # --- comic generation ------------------------------------------------------------------
  # Comics are drawn by Gemini (no local GPU use); the dashboard is at :8771/dashboard.

  redis:
    profiles: [comic]
    image: redis:7-alpine # job queue for the comic worker
    restart: unless-stopped

  docker-proxy:
    profiles: [comic]
    # Read-only socket proxy: the dashboard lists this stack's containers, nothing else.
    image: wollomatic/socket-proxy:1
    environment:
      - SP_ALLOW_GET=^/containers/json$
      # Listen on the compose network and accept only the dashboard (the defaults,
      # 127.0.0.1, are unreachable from other containers).
      - SP_LISTENIP=0.0.0.0
      - SP_ALLOWFROM=comic-api
    # The image runs as nobody; it needs the host's docker group to open the socket.
    # Check with: stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-947}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  comic-api:
    profiles: [comic]
    build: ./comic
    command: uvicorn app.api:app --host 0.0.0.0 --port 8771
    env_file: ./comic/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      # data/sessions.db (transcripts) and data/comic/ (bible, comics, limits). Not read-only:
      # SQLite readers of a WAL database still need to write its shared-memory file.
      - ./data:/data
    # Dashboard at http://127.0.0.1:8771/dashboard, on the server only.
    ports:
      - "127.0.0.1:8771:8771"
    depends_on:
      - backend
      - redis
      - docker-proxy
    restart: unless-stopped

  comic-worker:
    profiles: [comic]
    build: ./comic
    command: arq app.worker.WorkerSettings
    env_file: ./comic/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  whisper-models:
