name: compose

on:
  push:
    paths: ["compose.yaml", "**/Dockerfile", ".github/workflows/compose.yml"]
  pull_request:
    paths: ["compose.yaml", "**/Dockerfile", ".github/workflows/compose.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder env files
        run: |
          echo "CLOUDFLARE_TUNNEL_TOKEN=ci" > .env
          for dir in backend discord-bot stt-worker comic; do touch "$dir/.env"; done
      - name: Validate every profile combination
        run: |
          for profiles in "" transcription comic transcription,comic; do
            echo "::group::COMPOSE_PROFILES='$profiles'"
            COMPOSE_PROFILES="$profiles" docker compose config --quiet
            COMPOSE_PROFILES="$profiles" docker compose config --services
            echo "::endgroup::"
          done
      - name: Comic services
        # Comics are drawn by Gemini: no local renderer, and the Docker socket proxy only lets
        # the dashboard list containers (read-only).
        run: |
          COMPOSE_PROFILES=transcription,comic docker compose config > resolved.yaml
          # (Not "! grep": a negated command never fails a "set -e" script.)
          if grep -q "comfyui" resolved.yaml; then echo "ComfyUI is still in compose"; exit 1; fi
          if grep -q "SP_ALLOW_POST" resolved.yaml; then echo "docker-proxy allows POST"; exit 1; fi
          grep -qF 'SP_ALLOW_GET: ^/containers/json$' resolved.yaml
          # The dashboard lists containers of this compose project only.
          grep -q "^name: vtt-automaton$" resolved.yaml
          grep -q 'compose_project: str = "vtt-automaton"' comic/app/config.py
