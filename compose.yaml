services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      VTT_RULES_DB_PATH: /data/pf2e_remaster.db
      VTT_SESSIONS_DB_PATH: /data/sessions.db
    volumes:
    - ./data:/data
    ports:
    - 127.0.0.1:8765:8765
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
    - backend
    restart: unless-stopped
  stt-worker:
    profiles:
    - transcription
    build: ./stt-worker
    env_file: ./stt-worker/.env
    environment:
      STT_BACKEND_URL: http://backend:8765
    volumes:
    - whisper-models:/models
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    depends_on:
    - backend
    restart: unless-stopped
  discord-bot:
    profiles:
    - transcription
    build: ./discord-bot
    env_file: ./discord-bot/.env
    environment:
      BACKEND_URL: http://backend:8765
      STT_URL: http://stt-worker:8770
      DATA_DIR: /data
    volumes:
    - ./data/discord-bot:/data
    depends_on:
    - backend
    - stt-worker
    restart: unless-stopped
  redis:
    profiles:
    - comic
    image: redis:7-alpine
    restart: unless-stopped
  comfyui:
    profiles:
    - comic
    build: ./comic/comfyui
    volumes:
    - ./data/comfyui/models:/app/models
    - ./data/comfyui/output:/app/output
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    restart: unless-stopped
  docker-proxy:
    profiles:
    - comic
    image: wollomatic/socket-proxy:1
    environment:
    - SP_ALLOW_POST=^/containers/.*-stt-worker-1/(start|stop)$
    - SP_ALLOW_GET=^/containers/json$|^/containers/.*-stt-worker-1/json$
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
  comic-api:
    profiles:
    - comic
    build: ./comic
    command: uvicorn app.api:app --host 0.0.0.0 --port 8771
    env_file: ./comic/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
    - ./data:/data
    depends_on:
    - backend
    - redis
    restart: unless-stopped
  comic-worker:
    profiles:
    - comic
    build: ./comic
    command: arq app.worker.WorkerSettings
    env_file: ./comic/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      COMFYUI_URL: http://comfyui:8188
      DOCKER_PROXY_URL: http://docker-proxy:2375
      STT_CONTAINER_NAME: vtt-automaton-comic-stt-worker-1
    volumes:
    - ./data:/data
    - ./data/comfyui/output:/comfy_output
    depends_on:
    - backend
    - redis
    - docker-proxy
    restart: unless-stopped
volumes:
  whisper-models: null
