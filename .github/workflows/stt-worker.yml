name: stt-worker

on:
  push:
    paths: ["stt-worker/**", ".github/workflows/stt-worker.yml"]
  pull_request:
    paths: ["stt-worker/**", ".github/workflows/stt-worker.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stt-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Without the "whisper" extra: tests use a fake model, no GPU or model download.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
