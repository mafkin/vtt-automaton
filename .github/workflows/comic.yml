name: comic

on:
  push:
    paths: ["comic/**", ".github/workflows/comic.yml"]
  pull_request:
    paths: ["comic/**", ".github/workflows/comic.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen # fails if uv.lock is out of date with pyproject.toml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
