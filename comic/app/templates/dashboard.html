<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTT Comic Generation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-slate-900 text-slate-200 p-8">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold text-white">VTT Automaton Dashboard</h1>

        <!-- Mode: idle, or comic mode (STT stopped, ComfyUI rendering) -->
        <div class="bg-slate-800 p-4 rounded-lg shadow-lg border border-slate-700"
             hx-get="/api/v1/dashboard/mode" hx-trigger="load, every 5s">
            <span class="text-slate-400">Loading mode...</span>
        </div>

        <!-- Comic: pick a finished session's transcript. Loaded once so a refresh doesn't
             reset the selection; the server checks again when Generate is pressed. -->
        <div class="bg-slate-800 p-6 rounded-lg shadow-lg border border-slate-700">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-white">Generate Comic</h2>
                <button hx-get="/api/v1/dashboard/picker" hx-target="#picker"
                        class="text-sm text-slate-400 hover:text-white">↻ Refresh</button>
            </div>
            <div hx-get="/api/v1/dashboard/picker" hx-trigger="load" id="picker">
                <p class="text-slate-400">Loading transcripts...</p>
            </div>
        </div>

        <!-- Process State -->
        <div class="bg-slate-800 p-6 rounded-lg shadow-lg border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-white">Running Processes (Docker)</h2>
            <div hx-get="/api/v1/dashboard/containers" hx-trigger="load, every 5s" id="container-list">
                <p class="text-slate-400">Loading container state...</p>
            </div>
        </div>

        <!-- Latest Sessions -->
        <div class="bg-slate-800 p-6 rounded-lg shadow-lg border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-white">Recent Sessions</h2>
            <div hx-get="/api/v1/dashboard/sessions" hx-trigger="load, every 10s" id="session-list">
                <p class="text-slate-400">Loading sessions...</p>
            </div>
        </div>
    </div>
</body>
</html>
